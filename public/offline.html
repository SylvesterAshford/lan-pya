<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Lan Pya · Offline</title>
<script>
  // The address bar still shows the page the reader asked for; its locale
  // picks the language before anything paints.
  if (location.pathname === "/my" || location.pathname.indexOf("/my/") === 0) document.documentElement.lang = "my";
  // Back online: load the page they wanted.
  addEventListener("online", function () { location.reload(); });
</script>
<!--
  Shown by public/sw.js when a page cannot load because the connection is
  gone. Static and self-contained: no app CSS, no data about anyone, so it is
  safe on a shared phone. Colours and sizes are the DESIGN.md tokens, written
  out. The Burmese reuses the app's own strings except the heading.
-->
<style>
  @font-face { font-family: "Padauk"; font-weight: 400; font-display: swap; src: url("/fonts/padauk-myanmar-400.v1.woff2") format("woff2"); unicode-range: U+1000-109F, U+200C-200D, U+25CC, U+A92E, U+A9E0-A9FE, U+AA60-AA7F; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px; color: #1e2b28; background: #f8fafc; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  html[lang="my"] body { font-family: "Avenir Next", "Segoe UI", "Padauk", "Myanmar Text", "Noto Sans Myanmar", sans-serif; font-size: 17px; line-height: 1.7; }
  main { width: 100%; max-width: 420px; padding: 32px 24px; background: #ffffff; border: 1px solid #d8e4e0; border-radius: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: #0f172a; font-weight: 700; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  h1 { margin: 0 0 8px; color: #0f172a; font-size: 24px; line-height: 1.15; letter-spacing: -0.6px; }
  html[lang="my"] h1 { line-height: 1.5; letter-spacing: 0; }
  p { margin: 0 0 12px; color: #5f6e6a; }
  button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 20px; color: #ffffff; background: #111827; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #080d18; }
  button:focus-visible { outline: 2px solid #0f6e56; outline-offset: 2px; }
  [lang="my"] [data-en], [lang="en"] [data-my] { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/lan-pya-logo.jpg" alt="" width="32" height="32"><span data-en>Lan Pya</span><span data-my>လမ်းပြ</span></div>
  <h1><span data-en>You're offline</span><span data-my>ချိတ်ဆက်မှု မရှိပါ</span></h1>
  <p><span data-en>This page needs a connection. Check your connection and try again.</span><span data-my>ချိတ်ဆက်မှုကို စစ်ပြီး ထပ်ကြိုးစားပါ။</span></p>
  <p><span data-en>Drafts of your missions are saved on this device.</span><span data-my>Draft ကို ဤစက်တွင် သိမ်းထားသည်</span></p>
  <button type="button" onclick="location.reload()"><span data-en>Try again</span><span data-my>ထပ်ကြိုးစားမည်</span></button>
</main>
</body>
</html>
