<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" role="img" aria-labelledby="title desc">
  <title id="title">Lan Pya front-facing mascot</title>
  <desc id="desc">A hopeful young Myanmar learner wearing a navy hoodie and teal backpack.</desc>
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17305C"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14978D"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC18D"/>
      <stop offset="1" stop-color="#E98A58"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Backpack straps -->
    <path d="M170 245C143 274 137 332 151 391" fill="none" stroke="#095D59" stroke-width="25"/>
    <path d="M342 245C369 274 375 332 361 391" fill="none" stroke="#095D59" stroke-width="25"/>
    <path d="M170 245C143 274 137 332 151 391" fill="none" stroke="url(#teal)" stroke-width="17"/>
    <path d="M342 245C369 274 375 332 361 391" fill="none" stroke="url(#teal)" stroke-width="17"/>

    <!-- Neck -->
    <path d="M220 215V258H292V215Z" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>

    <!-- Ears -->
    <ellipse cx="184" cy="166" rx="20" ry="30" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>
    <ellipse cx="328" cy="166" rx="20" ry="30" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>
    <path d="M181 162c12-8 16 8 7 18" fill="none" stroke="#C96C42" stroke-width="3"/>
    <path d="M331 162c-12-8-16 8-7 18" fill="none" stroke="#C96C42" stroke-width="3"/>

    <!-- Head -->
    <path d="M256 76c54 0 78 37 73 90-4 53-34 90-73 90s-69-37-73-90c-5-53 19-90 73-90Z" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>

    <!-- Hair -->
    <path d="M183 147c-13-61 24-106 77-104 22 1 38 9 47 21 11-2 21-8 28-20 7 16 3 31-9 43 10-1 19-5 28-13 1 29-14 50-38 57-20-23-51-29-76-20-20 7-37 20-57 36Z" fill="#071936" stroke="#06142B" stroke-width="4"/>
    <path d="M215 82c27-22 69-26 98-2" fill="none" stroke="#17305C" stroke-width="7" opacity=".8"/>
    <path d="M315 67c5 1 10-2 14-8" fill="none" stroke="#F59E0B" stroke-width="4"/>

    <!-- Face -->
    <path d="M211 157c10-7 23-7 34-1" fill="none" stroke="#101A2E" stroke-width="5"/>
    <path d="M267 156c11-6 24-6 34 1" fill="none" stroke="#101A2E" stroke-width="5"/>
    <ellipse cx="229" cy="170" rx="6" ry="8" fill="#071936"/>
    <ellipse cx="283" cy="170" rx="6" ry="8" fill="#071936"/>
    <circle cx="231" cy="168" r="2" fill="#FFF"/>
    <circle cx="285" cy="168" r="2" fill="#FFF"/>
    <path d="M256 172l-5 20 10 2" fill="none" stroke="#C96C42" stroke-width="3"/>
    <path d="M235 211c13 10 29 10 42 0" fill="none" stroke="#A84F3A" stroke-width="4"/>

    <!-- Hood -->
    <path d="M183 286c1-38 31-62 73-62s72 24 73 62l-34 16h-78Z" fill="#0B2347" stroke="#071936" stroke-width="4"/>
    <path d="M207 242c11 22 27 35 49 45 22-10 38-23 49-45" fill="none" stroke="#F59E0B" stroke-width="5"/>

    <!-- Arms -->
    <path d="M184 276c-34 9-51 33-55 73l-7 137c-2 30 17 47 40 39 16-6 21-20 20-42l9-118Z" fill="url(#hoodie)" stroke="#071936" stroke-width="4"/>
