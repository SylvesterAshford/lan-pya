    <path d="M135 384c10 8 23 11 39 8" fill="none" stroke="#28436B" stroke-width="4"/>
    <path d="M377 384c-10 8-23 11-39 8" fill="none" stroke="#28436B" stroke-width="4"/>

    <!-- Torso -->
    <path d="M181 276c20-10 43-15 75-15s55 5 75 15l15 177c2 25-15 42-39 42H205c-24 0-41-17-39-42Z" fill="url(#hoodie)" stroke="#071936" stroke-width="4"/>

    <!-- Drawstrings -->
    <path d="M233 286v72M279 286v72" fill="none" stroke="#F59E0B" stroke-width="5"/>
    <circle cx="233" cy="360" r="5" fill="#F59E0B"/>
    <circle cx="279" cy="360" r="5" fill="#F59E0B"/>

    <!-- Hoodie pocket -->
    <path d="M206 402h100l16 58c-18 12-42 18-66 18s-48-6-66-18Z" fill="#102A50" stroke="#071936" stroke-width="3"/>
    <path d="M210 404c11 23 26 31 46 31s35-8 46-31" fill="none" stroke="#28436B" stroke-width="3"/>

    <!-- Chest journey mark -->
    <g transform="translate(292 318)">
      <path d="M0 19h13L25 7l9 9-21 21H0Z" fill="#0F766E"/>
      <path d="M24 0 45 7 31 27l-7-11Z" fill="#F59E0B"/>
      <path d="M0 19 19 0l5 16-11 3Z" fill="#15998F"/>
    </g>

    <!-- Hands -->
    <path d="M123 482c-1 31 5 56 23 63 14 5 27-5 27-23l-2-34Z" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>
    <path d="M389 482c1 31-5 56-23 63-14 5-27-5-27-23l2-34Z" fill="url(#skin)" stroke="#C96C42" stroke-width="3"/>
    <path d="M142 511v23M370 511v23" fill="none" stroke="#C96C42" stroke-width="2"/>

    <!-- Pants -->
    <path d="M186 483c18 7 42 11 70 11s52-4 70-11l12 205h-70l-12-131-12 131h-70Z" fill="#10274A" stroke="#071936" stroke-width="4"/>
    <path d="M256 510v47" fill="none" stroke="#071936" stroke-width="4"/>
    <path d="M194 572c15 7 30 8 47 3M318 572c-15 7-30 8-47 3" fill="none" stroke="#28436B" stroke-width="3"/>

    <!-- Ankles -->
    <path d="M178 671h67v34h-67ZM267 671h67v34h-67Z" fill="#0B1E3B" stroke="#071936" stroke-width="4"/>

    <!-- Shoes -->
    <path d="M175 697c20-6 44-5 66 1l17 23c7 10 1 22-11 22h-87c-13 0-19-14-11-24Z" fill="#112D55" stroke="#071936" stroke-width="4"/>
