    <path d="M153 727h98M359 727h-98" fill="none" stroke="#F8FAFC" stroke-width="9"/>
    <path d="M187 698v28M325 698v28" fill="none" stroke="#F59E0B" stroke-width="7"/>
    <path d="M199 707h29M313 707h-29" fill="none" stroke="#637A99" stroke-width="3"/>
    <path d="M201 715h29M311 715h-29" fill="none" stroke="#637A99" stroke-width="3"/>
  </g>
</svg>
