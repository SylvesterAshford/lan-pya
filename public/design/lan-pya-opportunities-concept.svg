<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lan Pya opportunities tab concept</title>
  <desc id="desc">A clean opportunity discovery interface with verified employer and program partner logos, evidence-based recommendations, and clear application actions.</desc>
  <defs>
    <linearGradient id="partnerBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A35"/>
      <stop offset="1" stop-color="#0F354F"/>
    </linearGradient>
    <linearGradient id="warmWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".07"/>
    </filter>
    <clipPath id="usLogoClip"><rect x="0" y="0" width="216" height="74" rx="10"/></clipPath>
    <clipPath id="strategyLogoClip"><rect x="0" y="0" width="244" height="74" rx="10"/></clipPath>
    <style>
      .heading{font:800 50px Inter,system-ui,sans-serif;letter-spacing:-1.8px;fill:#0F172A}
      .section{font:750 28px Inter,system-ui,sans-serif;letter-spacing:-.5px;fill:#0F172A}
      .card-title{font:750 25px Inter,system-ui,sans-serif;letter-spacing:-.35px;fill:#0F172A}
      .body{font:400 18px Inter,system-ui,sans-serif;fill:#64748B}
      .body-dark{font:500 17px Inter,system-ui,sans-serif;fill:#334155}
      .label{font:800 12px Inter,system-ui,sans-serif;letter-spacing:1.5px;fill:#0F766E}
      .small{font:500 14px Inter,system-ui,sans-serif;fill:#64748B}
      .pill{font:700 14px Inter,system-ui,sans-serif}
      .button{font:750 16px Inter,system-ui,sans-serif}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#F8FAFC"/>

  <!-- Header -->
  <g transform="translate(64 58)">
    <text class="label" x="0" y="0">OPPORTUNITIES</text>
    <text class="heading" x="0" y="62">Your proof can open real doors.</text>
    <text class="body" x="0" y="102">Explore verified opportunities from employers and program partners. Every recommendation explains why it appears.</text>
  </g>

  <!-- Verified partnership banner -->
  <g transform="translate(64 200)" filter="url(#cardShadow)">
    <rect width="1472" height="178" rx="24" fill="url(#partnerBand)"/>
    <path d="M1105 0h367v178h-424c82-49 88-118 57-178Z" fill="#FFFFFF" opacity=".045"/>
    <circle cx="1375" cy="-5" r="116" fill="#F59E0B" opacity=".10"/>
    <g transform="translate(34 32)">
      <rect width="54" height="54" rx="16" fill="#F59E0B"/>
      <path d="M15 38h11c6 0 9-2 13-8l6-9 7 5-7 10c-5 8-11 11-20 11H15Z" fill="#0F766E"/>
      <path d="m33 18 17-6-3 17-5-6-6 8-7-5 7-8Z" fill="#FFF"/>
      <text x="74" y="16" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#5EEAD4">VERIFIED PROGRAM PARTNERS</text>
      <text x="74" y="50" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="750" fill="#FFF">Digital Entrepreneurship Empowerment Program</text>
      <text x="74" y="80" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#B9C8D8">Opportunities published with named organizations, source links, and verification dates.</text>
    </g>

    <g transform="translate(940 32)">
      <rect width="216" height="74" rx="12" fill="#FFF"/>
      <image href="__US_LOGO__" x="0" y="0" width="216" height="74" preserveAspectRatio="xMidYMid meet" clip-path="url(#usLogoClip)"/>
      <rect x="232" width="244" height="74" rx="12" fill="#061A36" stroke="#2D4E72"/>
      <image href="__STRATEGY_LOGO__" x="232" y="0" width="244" height="74" preserveAspectRatio="xMidYMid meet"/>
      <g transform="translate(0 90)">
        <circle cx="8" cy="8" r="8" fill="#16A34A"/>
        <path d="m4 8 3 3 5-6" fill="none" stroke="#FFF" stroke-width="2"/>
        <text x="24" y="13" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="650" fill="#D9E7F1">Partner information checked 17 Aug 2026</text>
      </g>
    </g>
  </g>

  <!-- Discovery controls -->
  <g transform="translate(64 414)">
    <rect width="1012" height="64" rx="16" fill="#FFF" stroke="#CBDDD8" stroke-width="2"/>
    <circle cx="30" cy="30" r="10" fill="none" stroke="#64748B" stroke-width="2.5"/>
    <path d="m38 38 8 8" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <text class="body" x="60" y="39">Search roles, organizations, or skills</text>
    <g transform="translate(1032)">
      <rect width="216" height="64" rx="16" fill="#FFF" stroke="#CBDDD8" stroke-width="2"/>
      <path d="M22 23h22M27 32h12M31 41h4" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
      <text class="body-dark" x="58" y="39">Filters</text>
      <rect x="151" y="16" width="42" height="32" rx="16" fill="#DFF5EF"/>
      <text x="172" y="38" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F766E">2</text>
    </g>
    <g transform="translate(1268)">
      <rect width="204" height="64" rx="16" fill="#E2F4EF"/>
      <text x="102" y="39" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="750" fill="#0F5F59">For you · 4</text>
    </g>
  </g>

  <g transform="translate(64 508)">
    <text class="section" x="0" y="0">Recommended for you</text>
    <text class="small" x="0" y="31">Ordered by deadline and the evidence you have already built.</text>
    <g transform="translate(990 -26)">
      <rect width="482" height="54" rx="27" fill="#EEF3F7"/>
      <g transform="translate(5 5)"><rect width="144" height="44" rx="22" fill="#FFF"/><text class="pill" x="72" y="28" text-anchor="middle" fill="#0F172A">All</text></g>
      <text class="pill" x="230" y="33" text-anchor="middle" fill="#64748B">Internships</text>
      <text class="pill" x="382" y="33" text-anchor="middle" fill="#64748B">Challenges</text>
    </g>
  </g>

  <!-- Opportunity card 1 -->
  <g transform="translate(64 572)" filter="url(#cardShadow)">
    <rect width="1472" height="246" rx="22" fill="#FFF" stroke="#D7E4E1" stroke-width="2"/>
    <rect width="9" height="246" rx="5" fill="#0F766E"/>
    <g transform="translate(32 28)">
      <rect width="148" height="82" rx="15" fill="#071A35"/>
      <image href="__STRATEGY_LOGO__" x="7" y="8" width="134" height="66" preserveAspectRatio="xMidYMid meet"/>
      <rect y="100" width="148" height="28" rx="14" fill="#E3F6EF"/>
      <circle cx="18" cy="14" r="7" fill="#16A34A"/>
      <path d="m14 14 3 3 5-6" fill="none" stroke="#FFF" stroke-width="1.8"/>
      <text x="86" y="19" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="750" fill="#147A4B">Verified partner</text>
    </g>
    <g transform="translate(212 34)">
      <text class="label" x="0" y="0">FEATURED INTERNSHIP</text>
      <text class="card-title" x="0" y="39">Digital Entrepreneurship Program Intern</text>
      <text class="body-dark" x="0" y="72">Strategy First International College · Yangon · Hybrid</text>
      <g transform="translate(0 96)">
        <rect width="166" height="34" rx="17" fill="#E3F6EF"/><text class="pill" x="83" y="22" text-anchor="middle" fill="#147A4B">3 skills supported</text>
        <rect x="177" width="126" height="34" rx="17" fill="#FFF2D6"/><text class="pill" x="240" y="22" text-anchor="middle" fill="#945407">1 gap to close</text>
        <rect x="314" width="132" height="34" rx="17" fill="#EFF4F8"/><text class="pill" x="380" y="22" text-anchor="middle" fill="#52677A">Human reviewed</text>
      </g>
      <g transform="translate(0 151)">
        <text class="small" x="0" y="0">Your proof supports</text>
        <text class="body-dark" x="0" y="26">Responsive design · Content research · GitHub collaboration</text>
      </g>
    </g>
    <g transform="translate(1164 36)">
      <rect width="244" height="38" rx="19" fill="#FFF2D6"/>
      <circle cx="21" cy="19" r="7" fill="none" stroke="#945407" stroke-width="2"/><path d="M21 15v5l4 2" fill="none" stroke="#945407" stroke-width="2" stroke-linecap="round"/>
      <text class="pill" x="136" y="25" text-anchor="middle" fill="#945407">Closes in 6 days</text>
      <rect y="66" width="244" height="52" rx="14" fill="#0F766E"/>
      <text class="button" x="122" y="33" text-anchor="middle" fill="#FFF" transform="translate(0 66)">View opportunity  →</text>
      <text class="small" x="122" y="147" text-anchor="middle">Source checked today</text>
    </g>
  </g>

  <!-- Opportunity card 2 -->
  <g transform="translate(64 842)" filter="url(#cardShadow)">
    <rect width="1472" height="246" rx="22" fill="#FFF" stroke="#D7E4E1" stroke-width="2"/>
    <rect width="9" height="246" rx="5" fill="#F59E0B"/>
    <g transform="translate(32 28)">
      <rect width="148" height="82" rx="15" fill="#FFF" stroke="#E2E8F0"/>
      <image href="__US_LOGO__" x="6" y="8" width="136" height="66" preserveAspectRatio="xMidYMid meet"/>
      <rect y="100" width="148" height="28" rx="14" fill="#E3F6EF"/>
      <circle cx="18" cy="14" r="7" fill="#16A34A"/>
      <path d="m14 14 3 3 5-6" fill="none" stroke="#FFF" stroke-width="1.8"/>
      <text x="86" y="19" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="750" fill="#147A4B">Program partner</text>
    </g>
    <g transform="translate(212 34)">
      <text class="label" x="0" y="0">PARTNER CHALLENGE</text>
      <text class="card-title" x="0" y="39">Digital Entrepreneurship Community Challenge</text>
      <text class="body-dark" x="0" y="72">U.S. Embassy Rangoon · Remote · Myanmar</text>
      <g transform="translate(0 96)">
        <rect width="166" height="34" rx="17" fill="#E3F6EF"/><text class="pill" x="83" y="22" text-anchor="middle" fill="#147A4B">2 skills supported</text>
        <rect x="177" width="154" height="34" rx="17" fill="#FFF2D6"/><text class="pill" x="254" y="22" text-anchor="middle" fill="#945407">Build toward this</text>
        <rect x="342" width="145" height="34" rx="17" fill="#EFF4F8"/><text class="pill" x="414" y="22" text-anchor="middle" fill="#52677A">Open application</text>
      </g>
      <g transform="translate(0 151)">
        <text class="small" x="0" y="0">What is still missing</text>
        <text class="body-dark" x="0" y="26">One published campaign case study · English introduction</text>
      </g>
    </g>
    <g transform="translate(1164 36)">
      <rect width="244" height="38" rx="19" fill="#E3F6EF"/>
      <circle cx="21" cy="19" r="7" fill="#16A34A"/>
      <text class="pill" x="136" y="25" text-anchor="middle" fill="#147A4B">Applications open</text>
      <rect y="66" width="244" height="52" rx="14" fill="#FFF" stroke="#0F766E" stroke-width="2"/>
      <text class="button" x="122" y="33" text-anchor="middle" fill="#0F766E" transform="translate(0 66)">See requirements  →</text>
      <text class="small" x="122" y="147" text-anchor="middle">Original source available</text>
    </g>
  </g>

  <!-- Trust footer -->
  <g transform="translate(64 1120)">
    <circle cx="12" cy="12" r="12" fill="#DFF5EF"/>
    <path d="M7 12 11 16 18 8" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="36" y="17">Lan Pya never invents a match score. We show supported evidence, missing proof, source, and verification date.</text>
    <text x="1472" y="17" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#0F766E">How recommendations work  →</text>
  </g>
</svg>
