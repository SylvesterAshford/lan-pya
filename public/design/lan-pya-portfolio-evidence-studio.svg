      <text class="h3" x="0" y="36">Responsive Profile Card</text>
      <text class="body" x="0" y="66">A mobile-first personal profile with accessible</text><text class="body" x="0" y="90">structure and responsive behavior.</text>
      <g transform="translate(0 111)"><rect width="112" height="30" rx="15" fill="#E2F4EF"/><text class="pill" x="56" y="20" text-anchor="middle" fill="#0F766E">Responsive CSS</text><rect x="122" width="112" height="30" rx="15" fill="#EEF3F7"/><text class="pill" x="178" y="20" text-anchor="middle" fill="#52677A">Accessibility</text></g>
      <path d="M0 167h420" stroke="#E2E8F0"/>
      <g transform="translate(0 185)"><text class="small" x="0" y="0">Verified Aug 10, 2026</text><text x="420" y="0" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#0F766E">Open case study  →</text></g>
    </g>
  </g>

