      <path d="M22 9c2 8 6 12 14 14-8 2-12 6-14 14-2-8-6-12-14-14 8-2 12-6 14-14Z" fill="#FFF"/>
      <text class="label" x="62" y="14">AI CAREER KIT</text>
      <text class="h2" x="62" y="48">Build from proof, not claims.</text>
      <text class="body" x="0" y="88">Generate an editable résumé draft using only the</text>
      <text class="body" x="0" y="112">missions and skills you select.</text>

      <g transform="translate(0 133)">
