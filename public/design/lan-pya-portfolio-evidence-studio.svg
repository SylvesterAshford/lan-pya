        <rect x="312" width="166" height="50" rx="14" fill="#FFF" stroke="#D4B975" stroke-width="2"/>
        <text x="395" y="31" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#77500E">View example</text>
      </g>
      <text x="0" y="261" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#64748B">You review every sentence before export · PDF or DOCX</text>
    </g>
  </g>

