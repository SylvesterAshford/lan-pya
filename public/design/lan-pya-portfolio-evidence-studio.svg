  <!-- Privacy footer -->
  <g transform="translate(58 1121)">
    <circle cx="13" cy="13" r="13" fill="#E2F4EF"/>
    <path d="M8 13V9a5 5 0 0 1 10 0v4M7 13h12v9H7Z" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round"/>
    <text class="small" x="38" y="18">Private by default. You choose which case studies become public and which evidence the AI may use.</text>
    <text x="1484" y="18" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#0F766E">Portfolio privacy settings  →</text>
