    <text class="h1" x="0" y="58">Your work tells your story.</text>
    <text class="body" x="0" y="95">Turn completed missions into trusted case studies, then choose what becomes public or powers your résumé.</text>
    <g transform="translate(1120 15)">
      <rect width="176" height="48" rx="14" fill="#FFF" stroke="#BFD5CF" stroke-width="2"/>
      <path d="M22 25h18M31 16v18" stroke="#0F766E" stroke-width="2.3" stroke-linecap="round"/>
      <text class="button" x="103" y="30" text-anchor="middle" fill="#0F766E">Add project</text>
      <rect x="190" width="224" height="48" rx="14" fill="#0F766E"/>
      <path d="M215 17v16M207 25h16" stroke="#FFF" stroke-width="2.2" stroke-linecap="round"/>
      <text class="button" x="305" y="30" text-anchor="middle" fill="#FFF">Preview public profile</text>
    </g>
  </g>

  <!-- Proof passport -->
  <g transform="translate(58 244)" filter="url(#shadow)">
    <rect width="925" height="286" rx="24" fill="url(#navy)"/>
    <path d="M681 0h244v286H593c82-80 111-172 88-286Z" fill="#FFF" opacity=".035"/>
    <circle cx="815" cy="34" r="118" fill="#F59E0B" opacity=".09"/>
    <g transform="translate(34 30)">
      <circle cx="48" cy="48" r="48" fill="#D8F1EB"/>
      <circle cx="48" cy="39" r="18" fill="#E99B69"/>
      <path d="M23 89c4-22 15-33 25-33s21 11 25 33" fill="#0F766E"/>
      <path d="M31 33c0-18 11-27 21-27 14 0 23 10 21 29-11-9-25-12-42-2Z" fill="#07162F"/>
      <g transform="translate(117 4)">
        <text x="0" y="15" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#5EEAD4">THIRI'S PROOF PASSPORT</text>
        <text x="0" y="52" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="780" fill="#FFF">Frontend learner · Level 4</text>
        <text x="0" y="82" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#B8C8D8">Yangon, Myanmar · Open to internships and project collaborations</text>
      </g>
    </g>

    <g transform="translate(35 147)">
      <g><text x="0" y="0" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="820" fill="#FFF">6</text><text x="0" y="26" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#9FB1C4">completed missions</text></g>
      <path d="M160-14v54" stroke="#36516F"/>
      <g transform="translate(190)"><text x="0" y="0" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="820" fill="#FFF">4</text><text x="0" y="26" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#9FB1C4">human verified</text></g>
      <path d="M345-14v54" stroke="#36516F"/>
      <g transform="translate(375)"><text x="0" y="0" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="820" fill="#FFF">12</text><text x="0" y="26" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#9FB1C4">skills evidenced</text></g>
    </g>

    <!-- Skills route -->
    <g transform="translate(594 128)">
      <text x="0" y="0" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#5EEAD4">EVIDENCE TRAIL</text>
      <path d="M7 54c62-49 119 45 181-3 48-38 86-26 113-7" fill="none" stroke="#2A516C" stroke-width="6" stroke-linecap="round"/>
      <path d="M7 54c62-49 119 45 181-3" fill="none" stroke="#23A99D" stroke-width="6" stroke-linecap="round"/>
      <g fill="#16A34A" stroke="#FFF" stroke-width="4"><circle cx="8" cy="54" r="13"/><circle cx="95" cy="55" r="13"/><circle cx="187" cy="51" r="13"/></g>
      <circle cx="275" cy="40" r="13" fill="#F59E0B" stroke="#FFF" stroke-width="4"/>
      <text x="0" y="92" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#AFC0CF">Research</text>
      <text x="80" y="92" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#AFC0CF">Design</text>
      <text x="174" y="92" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#AFC0CF">Build</text>
      <text x="252" y="92" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#FCD56B">Publish</text>
    </g>
  </g>

  <!-- AI Career Kit -->
