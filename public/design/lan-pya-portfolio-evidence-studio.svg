        <g transform="translate(13 10)"><circle cx="12" cy="12" r="12" fill="#DCF5EE"/><path d="m7 12 4 4 7-9" fill="none" stroke="#0F766E" stroke-width="2"/><text x="35" y="17" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#334155">4 verified projects selected</text></g>
        <text x="455" y="28" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F766E">Change</text>
      </g>
      <g transform="translate(0 190)">
        <rect width="300" height="50" rx="14" fill="#0F172A"/>
        <path d="M22 15h18v22H22ZM26 21h10M26 26h10M26 31h7" fill="none" stroke="#FFF" stroke-width="2"/>
