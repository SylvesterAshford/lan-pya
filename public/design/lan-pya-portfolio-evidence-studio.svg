      <circle cx="79" cy="64" r="37" fill="#FFF3CE"/><circle cx="79" cy="64" r="21" fill="#F59E0B"/>
      <rect x="141" y="35" width="253" height="105" rx="14" fill="#FFF"/>
      <rect x="159" y="51" width="153" height="13" rx="6" fill="#0F766E" opacity=".18"/>
      <rect x="159" y="75" width="203" height="9" rx="4" fill="#CBD5E1"/>
      <rect x="159" y="91" width="176" height="9" rx="4" fill="#E2E8F0"/>
      <rect x="159" y="113" width="94" height="17" rx="8" fill="#FFF1C9"/>
      <g transform="translate(335 118)"><rect width="84" height="37" rx="19" fill="#FFF"/><circle cx="20" cy="18" r="11" fill="#16A34A"/><path d="m15 18 4 4 7-8" fill="none" stroke="#FFF" stroke-width="2"/><text x="57" y="23" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#147A4B">Verified</text></g>
