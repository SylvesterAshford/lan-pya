      <text class="h3" x="0" y="36">Audience &amp; Campaign Brief</text>
      <text class="body" x="0" y="66">Research-led campaign strategy with a clear</text><text class="body" x="0" y="90">audience, message, and ethical publishing plan.</text>
      <g transform="translate(0 111)"><rect width="118" height="30" rx="15" fill="#E2F4EF"/><text class="pill" x="59" y="20" text-anchor="middle" fill="#0F766E">User research</text><rect x="128" width="118" height="30" rx="15" fill="#EEF3F7"/><text class="pill" x="187" y="20" text-anchor="middle" fill="#52677A">Content strategy</text></g>
      <path d="M0 167h420" stroke="#E2E8F0"/>
      <g transform="translate(0 185)"><text class="small" x="0" y="0">Verified Aug 12, 2026</text><text x="420" y="0" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#0F766E">Open case study  →</text></g>
    </g>
  </g>

  <!-- In-progress / next proof card -->
