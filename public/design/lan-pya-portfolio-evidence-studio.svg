      <text class="h3" x="0" y="36">Opportunity Tracker</text>
      <text class="body" x="0" y="66">A searchable interface that explains supported</text><text class="body" x="0" y="90">evidence, gaps, sources, and deadlines.</text>
      <g transform="translate(0 111)"><rect width="94" height="30" rx="15" fill="#FFF2D6"/><text class="pill" x="47" y="20" text-anchor="middle" fill="#945407">AI review</text><rect x="104" width="130" height="30" rx="15" fill="#EEF3F7"/><text class="pill" x="169" y="20" text-anchor="middle" fill="#52677A">API integration</text></g>
      <path d="M0 167h446" stroke="#E2E8F0"/>
      <g transform="translate(0 185)"><text class="small" x="0" y="0">Submitted Aug 18, 2026</text><text x="446" y="0" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#0F766E">View submission  →</text></g>
