      <circle cx="24" cy="23" r="8" fill="none" stroke="#64748B" stroke-width="2"/><path d="m30 29 7 7" stroke="#64748B" stroke-width="2"/>
      <text x="49" y="30" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#64748B">Search your work</text>
      <rect x="264" width="132" height="48" rx="14" fill="#FFF" stroke="#CBDDD8" stroke-width="2"/>
      <text x="66" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#334155" transform="translate(264)">All work ⌄</text>
