      <path d="M35 132 142 33l66 61 45-42 174 122H35Z" fill="#0F766E" opacity=".78"/>
      <circle cx="318" cy="49" r="31" fill="#F59E0B"/>
      <path d="M171 62c28 21 29 46 3 68-14 12-21 26-21 44" fill="none" stroke="#FAE7A2" stroke-width="7" stroke-linecap="round"/>
      <path d="m168 57 9-17 11 17Z" fill="#F59E0B"/>
      <g transform="translate(351 118)"><rect width="94" height="37" rx="19" fill="#FFF2D6"/><text x="47" y="23" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="800" fill="#945407">In review</text></g>
    </g>
    <g transform="translate(24 220)">
