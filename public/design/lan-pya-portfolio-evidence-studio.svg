<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lan Pya portfolio and AI resume studio concept</title>
  <desc id="desc">An innovative portfolio workspace where completed missions become verified case studies and selected evidence can generate an editable resume draft.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102B50"/>
      <stop offset="1" stop-color="#07162F"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#159A90"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="aiWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#E9F8F5"/>
    </linearGradient>
    <linearGradient id="thumbOne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082342"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="thumbTwo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D766E"/>
      <stop offset="1" stop-color="#7DD3C7"/>
    </linearGradient>
    <linearGradient id="thumbThree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#223B67"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0F172A" flood-opacity=".07"/>
    </filter>
    <style>
      .h1{font:800 48px Inter,system-ui,sans-serif;letter-spacing:-1.8px;fill:#0F172A}
      .h2{font:760 28px Inter,system-ui,sans-serif;letter-spacing:-.7px;fill:#0F172A}
      .h3{font:750 20px Inter,system-ui,sans-serif;letter-spacing:-.25px;fill:#0F172A}
      .body{font:400 17px Inter,system-ui,sans-serif;fill:#64748B}
      .bodyDark{font:500 16px Inter,system-ui,sans-serif;fill:#334155}
      .small{font:500 13px Inter,system-ui,sans-serif;fill:#64748B}
      .label{font:800 12px Inter,system-ui,sans-serif;letter-spacing:1.5px;fill:#0F766E}
      .pill{font:700 13px Inter,system-ui,sans-serif}
      .button{font:750 15px Inter,system-ui,sans-serif}
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#F8FAFC"/>

  <!-- App bar -->
  <g>
    <rect width="1600" height="72" fill="#FFF"/>
    <path d="M0 71h1600" stroke="#DCE6E3"/>
    <g transform="translate(42 18)">
      <path d="M2 29h13c7 0 11-3 15-9l7-10 8 6-8 12c-5 8-12 12-23 12H2Z" fill="#0F766E"/>
      <path d="m27 8 22-7-5 22-6-7-7 10-8-6 8-10Z" fill="#F59E0B"/>
      <path d="M6 2h10v25c0 7 4 10 11 10h23v7H24C12 44 6 38 6 27Z" fill="#0F172A"/>
      <text x="61" y="29" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800" fill="#0F172A">Lan Pya</text>
    </g>
    <g transform="translate(330 0)" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#64748B">
      <text x="0" y="43">Home</text><text x="100" y="43">Roadmap</text><text x="225" y="43">Missions</text><text x="344" y="43" fill="#0F172A" font-weight="780">Portfolio</text><text x="462" y="43">Opportunities</text>
      <rect x="335" y="68" width="78" height="3" rx="2" fill="#0F766E"/>
    </g>
    <g transform="translate(1250 16)">
      <rect width="112" height="40" rx="20" fill="#FFF7DF"/><text x="56" y="26" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="750" fill="#8B5409">★  240 XP</text>
      <circle cx="226" cy="20" r="20" fill="#DFF5EF"/><text x="226" y="26" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#0F766E">T</text>
      <path d="M271 15h20M271 21h20M271 27h20" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

